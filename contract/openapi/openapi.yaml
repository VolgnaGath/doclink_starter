openapi: 3.0.0
info:
  title: DocLink API
  version: 1.0.0
tags: []
paths:
  /api/v1/corpus/import:
    post:
      operationId: V1_importCorpus
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusImportResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archive:
                  type: string
                  format: binary
                seed:
                  type: integer
                  format: int64
                tune_share:
                  type: number
                  format: double
              required:
                - archive
                - seed
                - tune_share
            encoding:
              archive:
                contentType: '*/*'
              seed:
                contentType: text/plain
      security:
        - ApiKeyAuth: []
  /api/v1/documents:
    post:
      operationId: V1_uploadDocuments
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                client_id:
                  $ref: '#/components/schemas/uuid'
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                is_anonymized:
                  type: boolean
              required:
                - client_id
                - files
            encoding:
              client_id:
                contentType: text/plain
              files:
                contentType: '*/*'
              is_anonymized:
                contentType: text/plain
      security:
        - ApiKeyAuth: []
    get:
      operationId: V1_listDocuments
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DocumentKind'
          explode: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DocumentStatus'
          explode: false
        - name: split
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Split'
          explode: false
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DocumentSource'
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  total:
                    type: integer
                    format: int64
                  limit:
                    type: integer
                    format: int32
                  offset:
                    type: integer
                    format: int32
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/documents/{id}:
    get:
      operationId: V1_getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/documents/{id}/process:
    post:
      operationId: V1_processDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/experiments:
    post:
      operationId: V1_createExperiment
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRun'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreate'
      security:
        - ApiKeyAuth: []
  /api/v1/experiments/{id}:
    get:
      operationId: V1_getExperiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDetail'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/experiments/{id}/export:
    get:
      operationId: V1_exportExperiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: format
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ExportFormat'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/links:
    get:
      operationId: V1_listLinks
      parameters:
        - name: document_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: link_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LinkType'
          explode: false
        - name: origin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LinkOrigin'
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link'
                  total:
                    type: integer
                    format: int64
                  limit:
                    type: integer
                    format: int32
                  offset:
                    type: integer
                    format: int32
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/suggestions:
    get:
      operationId: V1_listSuggestions
      parameters:
        - name: decision
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SuggestionFilter'
          explode: false
        - name: document_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: run_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkSuggestion'
                  total:
                    type: integer
                    format: int64
                  limit:
                    type: integer
                    format: int32
                  offset:
                    type: integer
                    format: int32
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
        - ApiKeyAuth: []
  /api/v1/suggestions/{id}/review:
    post:
      operationId: V1_reviewSuggestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
        - ApiKeyAuth: []
  /health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
components:
  schemas:
    Ablation:
      type: string
      enum:
        - none
        - no_llm
        - no_checks
        - no_sem
    BadRequestResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
    Client:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        inn:
          type: string
        created_at:
          type: string
          format: date-time
    ConflictResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
    ContractRef:
      type: object
      properties:
        number:
          type: string
        date:
          type: string
          format: date
        quote:
          type: string
    CorpusImportResult:
      type: object
      required:
        - corpus_version_id
        - documents_imported
        - links_imported
        - tune_documents
        - test_documents
      properties:
        corpus_version_id:
          type: integer
          format: int64
        documents_imported:
          type: integer
          format: int32
        links_imported:
          type: integer
          format: int32
        tune_documents:
          type: integer
          format: int32
        test_documents:
          type: integer
          format: int32
    Counterparty:
      type: object
      required:
        - id
        - client_id
        - name
      properties:
        id:
          type: integer
          format: int64
        client_id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        inn:
          type: string
        kpp:
          type: string
        aliases:
          type: array
          items:
            type: string
    DocumentDetail:
      type: object
      required:
        - document
        - extractions
        - suggestions
        - links
        - stage_timings
      properties:
        document:
          $ref: '#/components/schemas/DocumentSummary'
        text:
          $ref: '#/components/schemas/DocumentText'
        extractions:
          type: array
          items:
            $ref: '#/components/schemas/Extraction'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/LinkSuggestion'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        stage_timings:
          type: array
          items:
            $ref: '#/components/schemas/StageTiming'
    DocumentKind:
      type: string
      enum:
        - договор
        - допсоглашение
        - счёт
        - акт
        - УПД
        - другое
    DocumentSource:
      type: string
      enum:
        - upload
        - mock1c
        - corpus
    DocumentStatus:
      type: string
      enum:
        - new
        - text
        - extracted
        - linked
        - review
        - manual
        - error
    DocumentSummary:
      type: object
      required:
        - id
        - client_id
        - source
        - filename
        - sha256
        - mime
        - registered_at
        - is_anonymized
        - in_scope
        - status
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        client_id:
          $ref: '#/components/schemas/uuid'
        corpus_version_id:
          type: integer
          format: int64
        corpus_doc_id:
          type: string
        deal_id:
          type: string
        split:
          $ref: '#/components/schemas/Split'
        source:
          $ref: '#/components/schemas/DocumentSource'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          type: string
        date:
          type: string
          format: date
        filename:
          type: string
        sha256:
          type: string
        mime:
          type: string
        registered_at:
          type: string
          format: date-time
        is_anonymized:
          type: boolean
        in_scope:
          type: boolean
        status:
          $ref: '#/components/schemas/DocumentStatus'
        created_at:
          type: string
          format: date-time
    DocumentText:
      type: object
      required:
        - pages
        - chars
        - ocr_pages
        - text
      properties:
        pages:
          type: integer
          format: int32
        chars:
          type: integer
          format: int32
        ocr_pages:
          type: integer
          format: int32
        text:
          type: string
        anonymized_text:
          type: string
    DocumentUploadResult:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
    Evidence:
      type: object
      properties:
        number:
          type: string
        date:
          type: string
        counterparty:
          type: string
        amount:
          type: string
    ExperimentCreate:
      type: object
      required:
        - name
        - method
        - embedder
        - weights
        - ablation
        - corpus_version_id
        - split_seed
      properties:
        name:
          type: string
        method:
          $ref: '#/components/schemas/ExperimentMethod'
        model_config_id:
          type: integer
          format: int64
        embedder:
          type: string
        weights:
          type: object
          additionalProperties: {}
        tau_a:
          type: number
          format: double
        tau_r:
          type: number
          format: double
        ablation:
          $ref: '#/components/schemas/Ablation'
        corpus_version_id:
          type: integer
          format: int64
        split_seed:
          type: integer
          format: int64
    ExperimentDetail:
      type: object
      required:
        - run
        - metrics
        - threshold_curve
      properties:
        run:
          $ref: '#/components/schemas/ExperimentRun'
        model_config:
          $ref: '#/components/schemas/ModelConfig'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentMetric'
        threshold_curve:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdCurvePoint'
    ExperimentMethod:
      type: string
      enum:
        - rules
        - semantic
        - combined
    ExperimentMetric:
      type: object
      required:
        - run_id
        - slice
        - metric
        - value
      properties:
        run_id:
          type: integer
          format: int64
        slice:
          type: string
        metric:
          type: string
        value:
          type: number
          format: double
    ExperimentRun:
      type: object
      required:
        - id
        - name
        - method
        - embedder
        - weights
        - ablation
        - corpus_version_id
        - split_seed
        - git_commit
        - status
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        method:
          $ref: '#/components/schemas/ExperimentMethod'
        model_config_id:
          type: integer
          format: int64
        embedder:
          type: string
        weights:
          type: object
          additionalProperties: {}
        tau_a:
          type: number
          format: double
        tau_r:
          type: number
          format: double
        ablation:
          $ref: '#/components/schemas/Ablation'
        corpus_version_id:
          type: integer
          format: int64
        split_seed:
          type: integer
          format: int64
        git_commit:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        cost_rub:
          type: string
        notes:
          type: string
    ExportFormat:
      type: string
      enum:
        - csv
        - md
        - png
    Extraction:
      type: object
      required:
        - id
        - document_id
        - model_config_id
        - contract_refs
        - evidence
        - valid
        - evidence_ok
        - created_at
      properties:
        id:
          type: integer
          format: int64
        document_id:
          $ref: '#/components/schemas/uuid'
        model_config_id:
          type: integer
          format: int64
        llm_call_id:
          type: integer
          format: int64
        doc_kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          type: string
        date:
          type: string
          format: date
        cp_name:
          type: string
        cp_inn:
          type: string
        amount:
          type: string
        subject:
          type: string
        contract_refs:
          type: array
          items:
            $ref: '#/components/schemas/ContractRef'
        supp_ref:
          $ref: '#/components/schemas/ContractRef'
        invoice_ref:
          $ref: '#/components/schemas/ContractRef'
        evidence:
          $ref: '#/components/schemas/Evidence'
        valid:
          type: boolean
        evidence_ok:
          type: boolean
        created_at:
          type: string
          format: date-time
    HealthStatus:
      type: object
      required:
        - status
        - db
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        db:
          type: boolean
        version:
          type: string
    InternalServerErrorResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
    JobRef:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - done
        - error
    Link:
      type: object
      required:
        - id
        - source_id
