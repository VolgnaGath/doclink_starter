components:
  schemas:
    Ablation:
      type: string
      enum:
        - none
        - no_llm
        - no_checks
        - no_sem
    BadRequestResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
    CardPatch:
      type: object
      required:
        - session_id
        - version
        - idempotency_key
      properties:
        session_id:
          $ref: '#/components/schemas/uuid'
        version:
          type: integer
          format: int32
          minimum: 0
        idempotency_key:
          $ref: '#/components/schemas/uuid'
        values:
          type: object
          additionalProperties: {}
          description: doc_kind, number, date (ДД.ММ.ГГГГ), counterparty_name/inn, amount, subject, contract_refs, supp_ref, invoice_ref; null — явная очистка.
        reset:
          type: array
          items:
            type: string
    Client:
      type: object
      required:
        - id
        - name
        - inn
        - namespace
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        inn:
          type: string
          nullable: true
        namespace:
          type: string
        created_at:
          type: string
          format: date-time
    ClientCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        inn:
          type: string
          nullable: true
          pattern: ^(\d{10}|\d{12})$
    ConflictResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
    ContractRef:
      type: object
      properties:
        number:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
        quote:
          type: string
          nullable: true
      description: Даты внутри извлечений/ручных ссылок — ДД.ММ.ГГГГ; дата самого Extraction — ISO plainDate.
    Copy:
      type: object
      required:
        - document_id
        - source_document_id
        - source_result_id
        - client_id
      properties:
        document_id:
          $ref: '#/components/schemas/uuid'
        source_document_id:
          $ref: '#/components/schemas/uuid'
        source_result_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        client_id:
          $ref: '#/components/schemas/uuid'
    CopyOrigin:
      type: object
      required:
        - working_set_id
        - source_document_id
        - source_result_id
        - initial_inputs
      properties:
        working_set_id:
          $ref: '#/components/schemas/uuid'
        source_document_id:
          $ref: '#/components/schemas/uuid'
        source_result_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        initial_inputs:
          type: boolean
    CorpusImportResult:
      type: object
      required:
        - corpus_version_id
        - reused
        - documents_imported
        - links_imported
      properties:
        corpus_version_id:
          $ref: '#/components/schemas/uuid'
        reused:
          type: boolean
        documents_imported:
          type: integer
          format: int32
        links_imported:
          type: integer
          format: int32
    CorpusVersion:
      type: object
      required:
        - id
        - name
        - imported_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        imported_at:
          type: string
          format: date-time
    DocumentDetail:
      type: object
      required:
        - document
        - text
        - extractions
        - result
        - links
        - review_state
        - review_actions
        - review_sessions
        - stage_timings
        - pipeline
        - working_copy
      properties:
        document:
          $ref: '#/components/schemas/DocumentSummary'
        text:
          type: object
          allOf:
            - $ref: '#/components/schemas/DocumentText'
          nullable: true
        extractions:
          type: array
          items:
            $ref: '#/components/schemas/Extraction'
        result:
          type: object
          allOf:
            - $ref: '#/components/schemas/SearchOutcome'
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        review_state:
          type: object
          allOf:
            - $ref: '#/components/schemas/ReviewState'
          nullable: true
        review_actions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewAction'
        review_sessions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewSession'
        stage_timings:
          type: array
          items:
            $ref: '#/components/schemas/StageTiming'
        pipeline:
          type: object
          allOf:
            - $ref: '#/components/schemas/Pipeline'
          nullable: true
        working_copy:
          type: object
          allOf:
            - $ref: '#/components/schemas/CopyOrigin'
          nullable: true
    DocumentKind:
      type: string
      enum:
        - договор
        - допсоглашение
        - счёт
        - акт
        - УПД
        - другое
    DocumentSource:
      type: string
      enum:
        - upload
        - mock1c
        - corpus
    DocumentStatus:
      type: string
      enum:
        - new
        - text
        - extracted
        - linked
        - review
        - manual
        - error
    DocumentSummary:
      type: object
      required:
        - id
        - client_id
        - corpus_version_id
        - split
        - source
        - kind
        - number
        - date
        - filename
        - sha256
        - mime
        - card_model_config_id
        - card_extraction_id
        - is_anonymized
        - status
        - registered_at
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        client_id:
          $ref: '#/components/schemas/uuid'
        corpus_version_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        split:
          allOf:
            - $ref: '#/components/schemas/Split'
          nullable: true
        source:
          $ref: '#/components/schemas/DocumentSource'
        kind:
          allOf:
            - $ref: '#/components/schemas/DocumentKind'
          nullable: true
        number:
          type: string
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        filename:
          type: string
        sha256:
          type: string
        mime:
          type: string
        card_model_config_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        card_extraction_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        is_anonymized:
          type: boolean
        status:
          $ref: '#/components/schemas/DocumentStatus'
        registered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DocumentText:
      type: object
      required:
        - text
        - pages
        - chars
        - ocr_pages
      properties:
        text:
          type: string
        pages:
          type: integer
          format: int32
        chars:
          type: integer
          format: int32
        ocr_pages:
          type: integer
          format: int32
    DocumentUploadResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UploadItem'
      description: 'Частичный приём: отдельный результат для каждого файла; общие ошибки отклоняют запрос целиком.'
    ErrorBody:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
    EvidenceCheck:
      type: object
      required:
        - field
        - ok
      properties:
        field:
          type: string
        ok:
          type: boolean
        quote:
          type: string
          nullable: true
        original_quote:
          type: string
          nullable: true
        method:
          type: string
          nullable: true
        start:
          type: integer
          format: int32
          nullable: true
        end:
          type: integer
          format: int32
          nullable: true
    ExperimentCreate:
      type: object
      required:
        - name
        - corpus_version_id
        - idempotency_key
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        corpus_version_id:
          $ref: '#/components/schemas/uuid'
        idempotency_key:
          $ref: '#/components/schemas/uuid'
        mode:
          type: string
          enum:
            - matrix
            - single
            - ablations
          default: matrix
        method:
          allOf:
            - $ref: '#/components/schemas/ExperimentMethod'
          default: combined
        model_config_id:
          $ref: '#/components/schemas/uuid'
        ablation:
          allOf:
            - $ref: '#/components/schemas/Ablation'
          default: none
    ExperimentDetail:
      type: object
      required:
        - id
        - name
        - corpus_version_id
        - status
        - mode
        - selected_model_id
        - progress
        - total
        - error
        - created_at
        - finished_at
        - dataset_hash
        - runs
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        corpus_version_id:
          $ref: '#/components/schemas/uuid'
        status:
          $ref: '#/components/schemas/RunStatus'
        mode:
          type: string
          enum:
            - matrix
            - single
            - ablations
        selected_model_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        progress:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        dataset_hash:
          type: string
          nullable: true
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentRun'
    ExperimentMethod:
      type: string
      enum:
        - rules
        - semantic
        - combined
    ExperimentMetric:
      type: object
      required:
        - split
        - slice
        - metric
        - value
        - numerator
        - denominator
      properties:
        split:
          $ref: '#/components/schemas/Split'
        slice:
          type: string
        metric:
          type: string
        value:
          type: number
          format: double
          nullable: true
        numerator:
          type: integer
          format: int64
          nullable: true
        denominator:
          type: integer
          format: int64
          nullable: true
    ExperimentRun:
      type: object
      required:
        - id
        - variant
        - method
        - model_config_id
        - ablation
        - status
        - progress
        - total
        - config
        - snapshot
        - protocol_hash
        - reused_test
        - test_started_at
        - started_at
        - finished_at
        - error
        - report
        - metrics
        - threshold_curves
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        variant:
          type: string
        method:
          $ref: '#/components/schemas/ExperimentMethod'
        model_config_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        ablation:
          $ref: '#/components/schemas/Ablation'
        status:
          anyOf:
            - $ref: '#/components/schemas/RunStatus'
            - type: string
              enum:
                - frozen
                - NO_FEASIBLE_CONFIGURATION
                - BLOCKED
        progress:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        config:
          type: object
          additionalProperties: {}
        snapshot:
          type: object
          additionalProperties: {}
        protocol_hash:
          type: string
          nullable: true
        reused_test:
          type: boolean
        test_started_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        report:
          type: object
          additionalProperties: {}
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentMetric'
        threshold_curves:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdCurvePoint'
    ExportFormat:
      type: string
      enum:
        - csv
        - md
        - png
    Extraction:
      type: object
      required:
        - id
        - document_id
        - model_config_id
        - llm_call_id
        - source_extraction_id
        - doc_kind
        - number
        - date
        - cp_name
        - cp_inn
        - amount
        - subject
        - contract_refs
        - supp_ref
        - invoice_ref
        - evidence
        - evidence_checks
        - valid
        - evidence_ok
        - cache_hit
        - is_current
        - preserved_error
        - error
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        document_id:
          $ref: '#/components/schemas/uuid'
        model_config_id:
          $ref: '#/components/schemas/uuid'
        llm_call_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        source_extraction_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
        doc_kind:
          allOf:
            - $ref: '#/components/schemas/DocumentKind'
          nullable: true
        number:
          type: string
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        cp_name:
          type: string
          nullable: true
        cp_inn:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        contract_refs:
          type: array
          items:
            $ref: '#/components/schemas/ContractRef'
        supp_ref:
          type: object
          allOf:
            - $ref: '#/components/schemas/ContractRef'
          nullable: true
        invoice_ref:
          type: object
          allOf:
            - $ref: '#/components/schemas/ContractRef'
          nullable: true
        evidence:
          type: object
          additionalProperties:
            type: string
            nullable: true
        evidence_checks:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceCheck'
        valid:
          type: boolean
        evidence_ok:
          type: boolean
        cache_hit:
          type: boolean
        is_current:
          type: boolean
        preserved_error:
          type: boolean
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Features:
      type: object
      required:
        - num
        - date
        - inn
        - name
        - sem
      properties:
        num:
          type: number
          format: double
        date:
          type: number
          format: double
        inn:
          type: number
          format: double
        name:
          type: number
          format: double
        sem:
          type: number
          format: double
        reference_index:
          type: integer
          format: int32
          nullable: true
    Fields:
      type: object
      properties:
        number:
          type: string
          nullable: true
        inn:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        amount:
          anyOf:
            - type: string
            - type: number
              format: double
          nullable: true
        references:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedReference'
        number_verified:
          type: boolean
          default: false
        counterparty_verified:
          type: boolean
          default: false
        amount_verified:
          type: boolean
          default: false
        error:
          type: string
          nullable: true
    HealthStatus:
      type: object
      required:
        - status
        - db
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        db:
          type: boolean
        version:
          type: string
    InternalServerErrorResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
    JobRef:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          $ref: '#/components/schemas/uuid'
        status:
          $ref: '#/components/schemas/JobStatus'
