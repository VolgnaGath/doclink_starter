[project]
name = "doclink"
version = "0.1.0"
description = "Подсистема установления связей между документами договорного процесса"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: медленные тесты",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["reference", "contract", "corpus", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
