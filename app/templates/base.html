<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DocLink{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="header">
      <a class="brand" href="/">DocLink</a>
      {% if user %}
        <nav><a href="/documents">Документы</a> · <a href="/documents/upload">Загрузить</a></nav>
        <form method="post" action="/logout">
          <span>{{ user }}</span>
          <button type="submit">Выйти</button>
        </form>
      {% endif %}
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
